baseURL = "https://www.algarafa.com"
languageCode = "en"
DefaultContentLanguage = "en"
title = "Website of Rafael Álvarez García"
theme = "anatole-mod"
summarylength = 10
enableEmoji = true
enableRobotsTXT = true
publishDir = "docs"

# Enable Disqus
#disqusShortname = ""

# Google Analytics
#googleAnalytics = "UA-123-45"

# Syntax highlighting
pygmentsUseClasses = true   
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = false

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
        unsafe=true
        [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
            block = [['\\[', '\\]'], ['$$', '$$']]
            inline = [['\\(', '\\)']]

[taxonomies]
    category = "categories"
    series = "series"
    tag = "tags"

# Alternative output format used only by the CICY Coxeter per-model pages
# (opted into via cascade in content/english/cicy-coxeter/_index.md) to render
# each page a second time under a /legacy/ sub-URL while we polish the main
# style. Scheduled for removal once polishing rounds are complete — see the
# "Legacy style — scheduled for removal" section of CLAUDE.md.
[outputFormats]
  [outputFormats.legacy]
    mediaType = "text/html"
    baseName = "index"
    path = "legacy"
    isHTML = true
    notAlternative = true
