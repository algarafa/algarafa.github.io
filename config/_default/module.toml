# English content (default language)
[[mounts]]
  source = "content/english"
  target = "content"
  [mounts.sites.matrix]
    languages = ["en"]

# Spanish content
[[mounts]]
  source = "content/spanish"
  target = "content"
  [mounts.sites.matrix]
    languages = ["es"]

# Share English publication pages into Spanish content tree.
# Exclude _index.md so the Spanish section title ("Publicaciones") is used.
[[mounts]]
  source = "content/english/publications"
  target = "content/publications"
  files = ["! _index.md"]
  [mounts.sites.matrix]
    languages = ["es"]

# Same idea for the CICY–Coxeter DB: share the English pages into the Spanish
# content tree so /es/cicy-coxeter/ exists (the still-English content, not yet
# translated) and the EN/ES language switcher toggles between the two URLs like
# every other section. _index.md is INCLUDED (there is no Spanish section index).
[[mounts]]
  source = "content/english/cicy-coxeter"
  target = "content/cicy-coxeter"
  [mounts.sites.matrix]
    languages = ["es"]
