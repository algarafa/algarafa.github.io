{{ define "main" }}
  <div class="post {{ with .Site.Params.doNotLoadAnimations }}{{ else }}animated fadeInDown{{ end }}">
    <div class="post__content">
      <p class="cicy-entry__breadcrumb">
        <a href="{{ "/cicy-coxeter/" | relURL }}">&larr; CICY Coxeter Database</a>
      </p>
      <p class="cicy-entry__legacy-banner" role="note">
        You are viewing the <strong>legacy</strong> rendering of this CICY.
        {{ with .OutputFormats.Get "html" }}
          <a href="{{ .RelPermalink }}">Switch to the current style &rarr;</a>
        {{ end }}
      </p>
      <h1>{{ .Title }}</h1>
      {{ .Content }}
    </div>
  </div>
  {{ partial "cicy-entry-assets-legacy.html" . }}
{{ end }}
