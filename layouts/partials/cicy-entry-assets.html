{{- $css := resources.Get "css/cicy-entry.css" | resources.Minify | resources.Fingerprint -}}
<link
  rel="stylesheet"
  href="{{ $css.RelPermalink }}"
  integrity="{{ $css.Data.Integrity }}"
  crossorigin="anonymous"
/>
{{- $js := resources.Get "js/cicy-entry.js" | resources.Minify | resources.Fingerprint -}}
<script
  src="{{ $js.RelPermalink }}"
  integrity="{{ $js.Data.Integrity }}"
  crossorigin="anonymous"
  defer
></script>
